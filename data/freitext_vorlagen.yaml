# freitext_vorlagen.yaml | v0.1 | Stand 31.10.2026
# Freitext-Vorlagen fuer den Log-Generator (WI-Projekt Thema 75, Schritt 2).
# Wird von src/generate_log.py gelesen. Nach Aenderungen Generator neu laufen lassen.
#
# Felder pro Vorlage:
#   id              stabil, nicht aendern (Referenz fuer Auswertung)
#   text            1 bis 3 Saetze, ASCII-Schreibweise (ae, oe, ue, ss)
#   stil            direkt     = Thema mit Schluesselwort benannt
#                   indirekt   = ohne Schluesselwort der Kategorie (z. B. Reklamation ohne "Reklamation")
#                   distraktor = nur bei irrelevant: enthaelt Fachwoerter, ist aber ohne Bezug zu Zahlung oder Mangel
#   source          claude | jan | <Modellname> (z. B. bei Ueberarbeitung durch ein anderes Modell)
#   original_claude nur bei ueberarbeiteten Vorlagen: urspruenglicher Text (Nachvollziehbarkeit)
#   reviewed_by_jan false | true (auf true setzen, wenn ueberarbeitet)
#
# Platzhalter:
#   {rechnungsnr}    Rechnungsnummer (nur bei fakturierten Faellen)
#   {betrag}         Rechnungsbetrag, Format "CHF 12'345.00" (nur bei fakturierten Faellen)
#   {lieferdatum}    Eingang der Lieferung beim Kunden, TT.MM.JJJJ (nur bei versendeten Faellen)
#   {datum}          Datum in der juengeren Vergangenheit (1 bis 7 Tage vor Stichtag)
#   {datum_zukunft}  Datum in der Zukunft (3 bis 20 Tage nach Stichtag)
#   {auftragsnr}     Auftragsnummer = case_id
# Regel: Vorlagen der Kategorie irrelevant duerfen nur {datum_zukunft} und {auftragsnr} verwenden,
# weil sie auch an nicht fakturierte Faelle gehaengt werden (Rauschen).
#
# Grundsatz: keine Mischformen. Jeder Text gehoert eindeutig zu genau einer Kategorie.


categories:
  complaint:
    - id: complaint_01
      text: "Die Lieferung vom {lieferdatum} ist unvollstaendig, es fehlen zwei Positionen. Wir reklamieren dies hiermit und bitten um Nachlieferung."
      stil: direkt
      source: claude
      reviewed_by_jan: false
    - id: complaint_02
      text: "Wir beanstanden die Lieferung zu Rechnung {rechnungsnr}: Drei Paletten kamen mit gebrochenen Deckeln an. Bitte holen Sie die Ware ab und liefern Sie Ersatz."
      stil: direkt
      source: claude-rev1
      original_claude: "Bei der Ware zu Rechnung {rechnungsnr} sind mehrere Teile beschaedigt angekommen. Fotos senden wir separat. Wir bitten um Ersatz."
      reviewed_by_jan: false
    - id: complaint_03
      text: "Reklamation: Die gelieferten Artikel entsprechen nicht der bestellten Ausfuehrung."
